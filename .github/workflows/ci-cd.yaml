name: CI - Build, Test, Push Images to dockerhub

# Real-company flow: CI (this file) only builds/tests/pushes images and bumps
# the image tag in Git. It NEVER runs `kubectl apply` or touches the cluster.
# ArgoCD, running inside the cluster, is the only thing with deploy
# credentials - it notices the new tag in Git and pulls it in (CD).
# This separation is the core idea of GitOps.

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'

env:
  REGISTRY: docker.io
  # Set DOCKERHUB_USERNAME as a repo variable (Settings -> Secrets and
  # variables -> Actions -> Variables) so this isn't hardcoded.
  IMAGE_PREFIX: docker.io/${{ vars.DOCKERHUB_USERNAME }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service: 'services/auth-service/**'
            product-service: 'services/product-service/**'
            cart-service: 'services/cart-service/**'
            order-service: 'services/order-service/**'
            notification-service: 'services/notification-service/**'
            api-gateway: 'services/api-gateway/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & run tests
        run: |
          cd services/${{ matrix.service }}
          npm install
          npm test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          # DOCKERHUB_TOKEN must be a Docker Hub Access Token (Account
          # Settings -> Security -> New Access Token), not your account
          # password. Stored as a repo secret, never a plain variable.
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:dev

      - name: Update image tag in Kustomize manifest (GitOps bump)
        run: |
          cd k8s/overlays/dev
          # kustomize edit set image rewrites the `newTag` for this service,
          # this commit is what ArgoCD detects and syncs - no kubectl needed.
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize edit set image ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "chore: bump ${{ matrix.service }} image to ${{ github.sha }} [skip ci]" || echo "nothing to commit"
          git push
