apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
# NOTE: base64 placeholder values for local/demo use only.
# In a real company this Secret is NEVER committed - it is generated at
# deploy time via External Secrets Operator / Sealed Secrets / AWS Secrets
# Manager + IRSA. See README "Secrets Management" section.
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
