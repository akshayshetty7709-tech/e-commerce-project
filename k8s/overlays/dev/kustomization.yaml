apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
  - ../../base
images:
  - name: ghcr.io/your-org/ecommerce-platform/auth-service
    newTag: dev
  - name: ghcr.io/your-org/ecommerce-platform/product-service
    newTag: dev
  - name: ghcr.io/your-org/ecommerce-platform/cart-service
    newTag: dev
  - name: ghcr.io/your-org/ecommerce-platform/order-service
    newTag: dev
  - name: ghcr.io/your-org/ecommerce-platform/notification-service
    newTag: dev
  - name: ghcr.io/your-org/ecommerce-platform/api-gateway
    newTag: dev
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
