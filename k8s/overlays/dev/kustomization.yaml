apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources:
  - ../../base
images:
  - name: docker.io/your-dockerhub-username/auth-service
    newTag: dev
  - name: docker.io/your-dockerhub-username/product-service
    newTag: dev
  - name: docker.io/your-dockerhub-username/cart-service
    newTag: dev
  - name: docker.io/your-dockerhub-username/order-service
    newTag: dev
  - name: docker.io/your-dockerhub-username/notification-service
    newTag: dev
  - name: docker.io/your-dockerhub-username/api-gateway
    newTag: dev
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
